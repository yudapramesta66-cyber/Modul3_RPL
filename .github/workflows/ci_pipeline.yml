name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode dari repositori
        uses: actions/checkout@v4

      - name: Setup lingkungan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instal dependensi proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan pengujian otomatis dengan Pytest
        run: |
          pytest -v